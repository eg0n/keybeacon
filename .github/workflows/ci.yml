name: ci

# Only changes to the app, its packaging or this file start a (costly) macOS runner.
on:
  push:
    paths: &app-paths
      - 'app/macos/**'
      - 'packaging/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *app-paths
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: swift build & test (app/macos)
        run: |
          cd app/macos
          swift build
          swift test

      # Ad-hoc signed: open it with right-click → Open the first time.
      - name: Package BleWidget.app as .dmg and .zip
        run: |
          version="$(git rev-parse --short HEAD)"
          ./packaging/make-app.sh "$version"
          test -d dist/BleWidget.app
          test -f "dist/BleWidget-$version.dmg"
          test -f "dist/BleWidget-$version.zip"

      - name: standalone-build assertion — no firmware-repo path (SC-003 / FR-005)
        run: |
          if grep -RInE '\.\./\.\./|zmk-config-totem|host/macos' app/macos --include='*.swift' --include='Package.swift'; then
            echo "ERROR: app references a firmware-repo path — build is not standalone"; exit 1
          fi
          echo "OK: app builds with no firmware repo present"

      - uses: actions/upload-artifact@v4
        with:
          name: BleWidget
          path: |
            dist/*.dmg
            dist/*.zip
